name: Organizar código-fonte do SIGEC

on:
  push:
    branches: [build/sigec-v1.2-windows]
    paths: ['.github/workflows/sigec-v12-windows.yml']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
      - name: Salvar o código-fonte na branch de integração
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/build/sigec-v1.2-windows
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e SIGEC_MVP
          python3 - <<'PYTHON'
          import base64, hashlib, io, pathlib, zipfile
          workflow = pathlib.Path('.github/workflows/sigec-v12-windows.yml')
          prefix = '# source-package: '
          raw = base64.b64decode(''.join(line[len(prefix):] for line in workflow.read_text().splitlines() if line.startswith(prefix)), validate=True)
          assert hashlib.sha256(raw).hexdigest() == '9dc24f9011f3b402dfc60f9bc7584e15dae5bfa1304d48775d1a99ea9086c585'
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for name in archive.namelist():
                  target = pathlib.PurePosixPath(name)
                  assert not target.is_absolute() and '..' not in target.parts
                  assert name == 'README.md' or target.parts[0] == 'SIGEC_MVP'
              archive.extractall('.')
          assert pathlib.Path('SIGEC_MVP/VERSION').read_text().strip() == '1.0.0'
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md SIGEC_MVP
          git diff --cached --check
          git commit -m 'Publica código-fonte e documentação do SIGEC 1.0'
          git push origin HEAD:refs/heads/build/sigec-v1.2-windows

