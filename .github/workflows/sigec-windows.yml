name: Gerar instalador SIGEC (Windows x64)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['SIGEC_MVP/**', '.github/workflows/sigec-windows.yml']
  push:
    branches: [main, 'build/**']
    paths: ['SIGEC_MVP/**', '.github/workflows/sigec-windows.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Preparar ferramentas na máquina Windows temporária
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Setup {
            param([string]$File, [string[]]$SetupArgs)
            $proc = Start-Process -FilePath $File -ArgumentList $SetupArgs -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "Falha ao executar $File (código $($proc.ExitCode))."
            }
          }

          $pythonInstaller = Join-Path $env:RUNNER_TEMP 'python-3.14.10-amd64.exe'
          $pythonRoot = Join-Path $env:RUNNER_TEMP 'sigec-python314'
          $pythonSha256 = '92480239264744fe0386a1bd8275786fefa126e3129e56a68e22b52c73329965'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.14.10/python-3.14.10-amd64.exe' -OutFile $pythonInstaller
          if ((Get-FileHash -LiteralPath $pythonInstaller -Algorithm SHA256).Hash -ne $pythonSha256) {
            throw 'O SHA-256 do instalador do Python não confere.'
          }
          Invoke-Setup -File $pythonInstaller -SetupArgs @(
            '/quiet', '/norestart', 'InstallAllUsers=0', 'PrependPath=0',
            'Include_launcher=0', 'Include_test=0', 'Include_pip=1', ('TargetDir="{0}"' -f $pythonRoot)
          )

          $innoInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $innoRoot = Join-Path $env:RUNNER_TEMP 'sigec-inno674'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $innoInstaller
          $signature = Get-AuthenticodeSignature -FilePath $innoInstaller
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)CN=Pyrsys B\.V\.(?:\s*,|$)') {
            throw "Assinatura do instalador do Inno Setup não confirmada: $($signature.Status)."
          }
          Invoke-Setup -File $innoInstaller -SetupArgs @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', ('/DIR="{0}"' -f $innoRoot)
          )

          $pythonExe = Join-Path $pythonRoot 'python.exe'
          $isccPath = Join-Path $innoRoot 'ISCC.exe'
          foreach ($path in @($pythonExe, $isccPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Ferramenta não encontrada no caminho esperado: $path"
            }
          }
          "SIGEC_CI_PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGEC_CI_ISCC_PATH=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Testar o código e gerar o instalador
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "SIGEC_MVP")
          node tests/check_ui_node.js
          if ($LASTEXITCODE -ne 0) { throw 'O teste de interface do SIGEC falhou.' }
          & .\packaging\build.ps1 -PythonExe $env:SIGEC_CI_PYTHON_EXE -ISCCPath $env:SIGEC_CI_ISCC_PATH
          if ($LASTEXITCODE -ne 0) { throw "Build do SIGEC falhou: $LASTEXITCODE" }
          $expected = (Get-Content -LiteralPath 'release\SHA256SUMS.txt' -Raw).Trim().Split(' ')[0]
          $actual = (Get-FileHash -LiteralPath 'release\Instalar SIGEC.exe' -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'SHA-256 do instalador não confere.' }

      - name: Conferir a instalação e o atalho na máquina de build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:GITHUB_WORKSPACE 'SIGEC_MVP\release\Instalar SIGEC.exe'
          $install = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Instalação de teste falhou: $($install.ExitCode)." }
          $desktop = [Environment]::GetFolderPath('DesktopDirectory')
          $lnkPath = Join-Path $desktop 'SIGEC.lnk'
          if (-not (Test-Path -LiteralPath $lnkPath -PathType Leaf)) { throw 'Atalho SIGEC não criado.' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($lnkPath)
          $exe = (Get-ItemProperty -LiteralPath 'HKCU:\Software\SIGEC').InstalledExe
          if ($shortcut.TargetPath -ne $exe -or $shortcut.Arguments) {
            throw 'O atalho SIGEC não aponta para o inicializador normal.'
          }
          if (($shortcut.IconLocation -split ",\s*", 2)[0].Trim([char]34) -ne $exe -or ($shortcut.IconLocation -split ",\s*", 2)[1] -ne "0") { throw 'Atalho não usa o ícone do SIGEC.' }
          $app = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--no-dialog') -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'O executável instalado não passou no self-test.' }

      - name: Disponibilizar o instalador e os registros do build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SIGEC-instalador-Windows-x64
          path: |
            SIGEC_MVP/release/Instalar SIGEC.exe
            SIGEC_MVP/release/SHA256SUMS.txt
            SIGEC_MVP/release/BUILD-INFO.json
            SIGEC_MVP/release/payload.json
            SIGEC_MVP/release/dependencies.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

